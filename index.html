<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dllux — Em Breve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #071921 0%, #0d2b38 55%, #06131a 100%);
      color: #f4f8fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.35);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      line-height: 1.35;
      font-weight: 700;
      margin-bottom: 14px;
      color: #f8fafc;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 28px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #22c55e;
      color: #052e16;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 15px 20px;
      border-radius: 12px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Em preparação</span>
    <div class="logo">DLLUX</div>
    <div class="subtitle">São Paulo • SP</div>
    <h1>Estamos preparando novidades para você</h1>
    <p>
      Nossa plataforma está em fase final de implantação e ajustes.
      Em breve estaremos no ar com acesso liberado.
    </p>
    <a class="btn" href="https://wa.me/5511986827282" target="_blank" rel="noopener">
      Falar com a Dllux no WhatsApp
    </a>
    <div class="footer">© 2026 Dllux • Todos os direitos reservados</div>
  </main>
</body>
</html>
